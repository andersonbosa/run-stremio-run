services:

  connection-helper:
    build:
      context: ./apps/connection-helper
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - exposed_network
    depends_on:
      - stremio-server
    # volumes:
    #   - ./:/usr/src/app:ro
    #   - node_modules

  webstremio:
    build:
      context: ./apps/webstremio
      dockerfile: Dockerfile.dev
    ports:
      - "8080:3000"
    networks:
      - exposed_network
    depends_on:
      - stremio-server

  stremio-server:
    image: stremio/server:latest
    ports:
      - "11470:11470"
    networks:
      - exposed_network

networks:
  exposed_network:
    driver: bridge
